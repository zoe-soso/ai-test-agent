# ==========================================================
# AI Test Agent · CI 配置模板（PEP 668 修复版）
#
# 用法：
#   1. 在 ai-test-agent 项目根建目录  .github/workflows/  （已有）
#   2. 把本文件复制过去覆盖原 test.yml
#   3. git add .github/  →  git commit  →  git push
#   4. 打开 https://github.com/zoe-soso/ai-test-agent/actions 看绿勾
#
# 关键说明：
#   · 不需要配任何 GitHub Secrets。本项目 107 条单元测试全走 Mock。
#   · 已本地验证（无 Key + LLM_MOCK=true）：107 passed / 2.15s
#   · **改用 venv 装依赖**：2023 年起 GitHub Actions 的 ubuntu runner
#     默认启用 PEP 668，直接 `pip install -r requirements.txt` 会报
#     "error: externally-managed-environment" 然后 14 秒左右挂掉。
#     用 venv 后就不再受这个限制。
# ==========================================================

name: AI Test Agent CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (venv)
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 单元测试全部离线 Mock，无需 API Key
      - name: Run unit tests
        env:
          LLM_MOCK: "true"
        run: |
          source .venv/bin/activate
          python -m pytest -q --no-header

      - name: Upload test cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-result
          path: .pytest_cache
          retention-days: 7

