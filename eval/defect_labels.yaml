# ============ 以下为 D009~D036 扩充样本（2026-09-06）============
#
# 扩充原则（重要）：标注答案必须能从报错文本里推断出来，否则指标测的是运气。
# 因此每条样本的报错中都刻意保留了「严重度线索词」：
#   P0 → 出现「所有/整批/全部/连接池/数据库/无法启动/collected 0」等阻塞性描述
#   P1 → 单个功能模块稳定失败，不涉及基础设施
#   P2 → 出现「偶发/重试通过/脚本/断言写法/并发/时机」等边界或脚本自身问题
#   P3 → 出现「文案/颜色/样式/边距/无障碍属性」且明确写了「功能正常/不影响使用」

